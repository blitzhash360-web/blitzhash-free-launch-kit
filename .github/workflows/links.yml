name: Links
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC: catches moved pricing pages
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every link in README, CONTRIBUTING and data/kit.json
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --no-progress README.md CONTRIBUTING.md data/kit.json
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
