name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: README list is generated from data/kit.json
        run: npm run check
      - name: CLI smoke test (database category)
        run: node bin/free-launch-kit.mjs database | grep -q "Supabase (Free)"
